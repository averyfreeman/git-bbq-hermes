# GitHabits v2 is the source of truth for this repository's Git policy.
# This repository's GitHub remote is explicitly public and already configured.
schema_version: "1.0.0"
version: 2
profile: autonomous
branch: main
versioning: semver
initial_tag: v0.1.0
commit_style: conventional-commits
actions:
  init: false
  branch: true
  stage: true
  commit: true
  tag: true
  remote: false
  push: true
authorization:
  scope: workflow
release:
  initial_tag_scope: new-repository-only
  commit_bumps:
    breaking_change: major
    feature: minor
    fix: patch
    performance: patch
    other: none
push:
  target: current
  after_commit: true
  after_tag: true
remote:
  provider: github
  owner: averyfreeman
  name: git-bbq-hermes
  visibility: public
  visibility_policy: ask-if-unspecified
  alias: origin
  status: configured
  url: https://github.com/averyfreeman/git-bbq-hermes.git
