name: CI

on:
  pull_request:
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal)"
      - name: Generate schemas
        run: go run ./cmd/git-bbq schema .
      - name: Verify generated schemas
        run: git diff --exit-code
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/git-bbq

  plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test native Hermes plugin and builder
        run: python3 -m unittest scripts.test_hermes_plugin scripts.test_hermes_builder -v
      - name: Install Hermes CLI for package validation
        run: curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash -s -- --non-interactive --skip-browser --skip-computer-use
      - name: Build Linux Hermes plugin package
        run: python3 scripts/build_hermes_plugin.py --output .tmp/git-bbq-hermes --target x86_64-linux --force
      - name: Diagnose Hermes plugin package
        run: hermes plugins doctor --ci .tmp/git-bbq-hermes
      - name: Validate Hermes plugin package
        run: hermes plugins validate --json .tmp/git-bbq-hermes
