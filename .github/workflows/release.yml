name: Git BBQ release artifacts

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux
            package_name: git-bbq-package-x86_64-linux
            asset_name: git-bbq-x86_64-linux.tar.gz
          - target: aarch64-darwin
            package_name: git-bbq-package-aarch64-darwin
            asset_name: git-bbq-aarch64-darwin.tar.gz
          - target: x86_64-darwin
            package_name: git-bbq-package-x86_64-darwin
            asset_name: git-bbq-x86_64-darwin.tar.gz
          - target: windows-x86_64
            package_name: git-bbq-package-windows-x86_64
            asset_name: git-bbq-windows-x86_64.tar.gz
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Hermes CLI for package validation
        run: curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash -s -- --non-interactive --skip-browser --skip-computer-use
      - name: Build Hermes plugin package
        run: |
          version="${GITHUB_REF_NAME#v}"
          python3 scripts/build_hermes_plugin.py \
            --output ".tmp/package-${{ matrix.target }}" \
            --target "${{ matrix.target }}" \
            --plugin-version "$version" \
            --force
      - name: Record source commit in package
        run: printf '%s\n' "$GITHUB_SHA" > ".tmp/package-${{ matrix.target }}/BUILD_SOURCE_SHA"
      - name: Diagnose Hermes plugin package
        run: hermes plugins doctor --ci ".tmp/package-${{ matrix.target }}"
      - name: Validate Hermes plugin package
        run: hermes plugins validate --json ".tmp/package-${{ matrix.target }}"
      - name: Attest bundled Go runtime
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ".tmp/package-${{ matrix.target }}/runtime/bin/${{ matrix.target }}/git-bbq*"
      - name: Archive Hermes plugin package
        run: tar -czf ".tmp/${{ matrix.asset_name }}" -C ".tmp/package-${{ matrix.target }}" .
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package_name }}
          path: .tmp/${{ matrix.asset_name }}
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: git-bbq-package-*
          path: .tmp/release-assets
          merge-multiple: true
      - name: Generate release checksums
        run: |
          cd .tmp/release-assets
          sha256sum git-bbq-*.tar.gz > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            .tmp/release-assets/git-bbq-*.tar.gz \
            .tmp/release-assets/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Git-BBQ Hermes $GITHUB_REF_NAME" \
            --generate-notes
